name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore API dependencies
        run: dotnet restore e-commerce-api.sln
      - name: Build API
        run: dotnet build e-commerce-api.sln --configuration Release --no-restore

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install web dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Type-check web
        run: corepack pnpm run typecheck
      - name: Lint web
        run: corepack pnpm run lint
      - name: Build web
        run: corepack pnpm run build
